default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-json" },
  { id = "detect-private-key" },
  { id = "no-commit-to-branch", args = ["-b", "main"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "lint",
    name = "oxlint",
    language = "system",
    entry = "npx oxlint",
    files = "\\.(ts|tsx|js|mjs)$",
    pass_filenames = true,
  },
  {
    id = "typecheck",
    name = "typecheck",
    language = "system",
    entry = "npx tsc --noEmit",
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "commitlint",
    name = "commitlint",
    language = "system",
    entry = "npx commitlint --edit",
    stages = ["commit-msg"],
    pass_filenames = false,
    always_run = true,
  },
]
